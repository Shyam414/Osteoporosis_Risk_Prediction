
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload X-Ray</title>

  <link rel="stylesheet" href="css/upload.css">
  <script src="js/api.js"></script>
</head>
<body>

<div id="navbar"></div>

<main class="container">

  <h2>Upload Your Knee X-Ray</h2>

  <form id="upload-form" class="upload-form">

    <label for="file" class="file-label">
      Choose an X-Ray Image
    </label>

    <input
      type="file"
      id="file"
      name="file"
      accept="image/*"
      required
    >

    <button type="submit" class="upload-btn" id="upload-btn">
      Upload & Predict
    </button>

    <p
      id="upload-message"
      class="upload-message"
      role="status"
      aria-live="polite"
    ></p>

  </form>

</main>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const form = document.getElementById("upload-form");
  const fileInput = document.getElementById("file");
  const messageEl = document.getElementById("upload-message");
  const button = document.getElementById("upload-btn");

  // Authentication Check

  try {
    getToken();
  } catch (error) {
    window.location.replace("login.html");
    return;
  }

  // Message Helper

  function showMessage(message, color = "red") {
    messageEl.style.color = color;
    messageEl.textContent = message;
  }

  // Load Navbar

  try {
    const response = await fetch("_navbar.html");

    if (!response.ok) {
      throw new Error("Unable to load navigation bar.");
    }

    const navbarHTML = await response.text();

    document.getElementById("navbar").innerHTML = navbarHTML;

    const logoutBtn = document.getElementById("logout-btn");

    if (logoutBtn) {
      logoutBtn.addEventListener("click", async (event) => {
        event.preventDefault();

        logoutBtn.disabled = true;

        try {
          await logout();
        } catch (error) {
          console.error("Logout error:", error);
          clearSession();
        }
      });
    }

  } catch (error) {
    console.error("Navbar loading error:", error);
    showMessage("Unable to load navigation bar. Please refresh the page.");
  }

  // Upload X-Ray

  form.addEventListener("submit", async (event) => {

    event.preventDefault();

    showMessage("");

    const file = fileInput.files[0];

    // Validate file selection
    if (!file) {
      showMessage("Please select an X-Ray image.");
      return;
    }

    // Validate image type
    if (!file.type || !file.type.startsWith("image/")) {
      showMessage("Please select a valid image file.");
      fileInput.value = "";
      return;
    }

    // Prevent duplicate uploads
    button.disabled = true;
    button.textContent = "Uploading...";

    try {

      // uploadFile() uses apiRequest(), which handles JWT refresh.
      const response = await uploadFile(file);

      if (response.job_id) {

        showMessage(
          "Prediction completed. Redirecting...",
          "green"
        );

        // Redirect to the result page.
        const params = new URLSearchParams({
          job_id: response.job_id
        });

        setTimeout(() => {
          window.location.href = `result.html?${params.toString()}`;
        }, 800);

        return;
      }

      showMessage(response.msg || "Upload failed. Please try again.");

    } catch (error) {

      console.error("Upload error:", error);

      showMessage(
        error.message || "Unable to upload the image. Please try again."
      );

    } finally {

      // Keep button disabled while redirecting.
      if (!messageEl.textContent.includes("Redirecting")) {
        button.disabled = false;
        button.textContent = "Upload & Predict";
      }

    }

  });

});
</script>

</body>
</html>
