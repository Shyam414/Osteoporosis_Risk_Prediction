
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="css/login.css" />
  <script src="js/api.js"></script>
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <h2>Admin Login</h2>
      <p class="subtitle">Restricted access</p>

      <form id="admin-login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" required />

        <button type="submit" id="login-btn">
          Login as Admin
        </button>

        <p id="admin-message" class="login-message"
           role="status" aria-live="polite"></p>
      </form>

      <div class="links">
        <span>•</span>
        <a href="login.html">Back to User Login</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("admin-login-form");
    const messageEl = document.getElementById("admin-message");
    const loginBtn = document.getElementById("login-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (loginBtn.disabled) return;

      messageEl.textContent = "";
      messageEl.style.color = "red";
      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      const email = document.getElementById("email")
        .value.trim().toLowerCase();

      const password = document.getElementById("password").value;

      try {
        // 1. Normal login
        const res = await login(email, password);

        if (!res.ok || !res.access_token) {
          messageEl.textContent = res.msg || "Login failed";
          return;
        }

        // 2. Already an admin
        if (res.role === "admin") {
          messageEl.style.color = "green";
          messageEl.textContent = "Admin login successful";

          window.location.href = "admin.html";
          return;
        }

        // 3. Admin bootstrap
        const bootstrapRes = await fetch(
          `${API_BASE}/admin/bootstrap`,
          {
            method: "POST",
            headers: {
              Authorization: `Bearer ${res.access_token}`
            }
          }
        );

        const data = await bootstrapRes.json().catch(() => ({}));

        if (bootstrapRes.ok) {
          messageEl.style.color = "green";
          messageEl.textContent =
            "Admin created successfully. Please login again.";

          // Remove only authentication data
          localStorage.removeItem("access_token");
          localStorage.removeItem("refresh_token");
          localStorage.removeItem("role");

          setTimeout(() => {
            window.location.href = "adminlogin.html";
          }, 1200);

          return;
        }

        messageEl.textContent =
          data.msg || "Not an admin account";

      } catch (error) {
        console.error("Admin login error:", error);
        messageEl.textContent =
          "Unable to connect to server. Please try again.";

      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login as Admin";
      }
    });
  </script>
</body>
</html>
