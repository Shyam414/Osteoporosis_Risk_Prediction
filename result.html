<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction Result</title>

  <link rel="stylesheet" href="css/result.css">
  <script src="js/api.js"></script>
</head>
<body>

<header id="navbar"></header>

<main class="container">

  <p id="result-message" class="result-message"></p>

  <section id="result" class="result-box"></section>

  <section class="history-section">

    <h1>Previous Predictions</h1>

    <div id="history" class="history-grid"></div>

  </section>

</main>

<script>

const token = localStorage.getItem("access_token");

if (!token) {
    window.location.href = "login.html";
}

const messageEl =
    document.getElementById("result-message");

async function initPage() {

    try {

        // ------------------------
        // Navbar
        // ------------------------

        const navbarHTML =
            await fetch("_navbar.html")
            .then(r => r.text());

        document.getElementById("navbar").innerHTML =
            navbarHTML;

        const logoutBtn =
            document.getElementById("logout-btn");

        if (logoutBtn) {

            logoutBtn.addEventListener("click", async e => {

                e.preventDefault();

                try {
                    await logout();
                }
                finally {

                    localStorage.removeItem("access_token");
                    localStorage.removeItem("role");
                    window.location.href =
                        "login.html";

                }

            });

        }

        // ------------------------
        // Latest Prediction
        // ------------------------

        const params =
            new URLSearchParams(window.location.search);

        const job_id =
            params.get("job_id");

        if (job_id) {

            const res = await fetch(

                `${API_BASE}/predict/result/${job_id}`,

                {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }

            );

            if (!res.ok)
                throw new Error("Prediction not found");

            const data =
                await res.json();

            const imgUrl =
                data.image_url || "placeholder.png";

            document.getElementById("result").innerHTML = `

                <h2>Prediction Result</h2>

                <div class="prediction-content">

                    <img
                        src="${imgUrl}"
                        class="prediction-img"
                        alt="X-Ray"
                    >

                    <div class="prediction-info">

                        <p class="filename">
                            ${data.filename}
                        </p>

                        <p class="prediction">

                            <strong>
                                ${data.prediction}
                            </strong>

                            <span>
                                (${data.probability}%)
                            </span>

                        </p>

                        <div class="probability-container">

                            <div
                                class="probability-fill ${
                                    data.prediction === "Positive"
                                    ? "positive"
                                    : "negative"
                                }"
                                style="width:${data.probability}%"
                            >

                                ${data.probability}%

                            </div>

                        </div>

                    </div>

                </div>

            `;

        }

        // ------------------------
        // History
        // ------------------------

        const history =
            await getDashboard();

        const historySection =
            document.getElementById("history");

        if (history.records &&
            history.records.length) {

            const cards =
                history.records.map(rec => `

                <div class="card">

                    <img
                        src="${rec.image_url || "placeholder.png"}"
                        alt="X-Ray"
                    >

                    <p class="filename">

                        ${rec.filename}

                    </p>

                    <p class="prediction">

                        ${rec.prediction}
                        (${rec.probability}%)

                    </p>

                </div>

            `);

            historySection.innerHTML =
                cards.join("");

        }
        else {

            historySection.innerHTML =
                "<p class='empty'>No history yet.</p>";

        }

    }
    catch (err) {

        console.error(err);

        messageEl.style.color = "red";

        messageEl.textContent =
            err.message || "Failed to load prediction.";

    }

}

initPage();

</script>

</body>
</html>
