
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="js/api.js"></script>
</head>

<body>

  <div id="navbar"></div>

  <main class="container">
    <h1>Dashboard</h1>
    <section id="history">
      <p>Loading history...</p>
    </section>
  </main>

  <script>
    "use strict";

    // AUTH GUARD

    try {
      getToken();
    } catch (error) {
      window.location.replace("login.html");
    }

    // DOM ELEMENTS

    const historySection = document.getElementById("history");
    const navbar = document.getElementById("navbar");

    // HTML ESCAPE HELPER

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    // LOAD NAVBAR

    async function loadNavbar() {
      try {
        const res = await fetch("_navbar.html");

        if (!res.ok) {
          throw new Error("Failed to load navbar");
        }

        navbar.innerHTML = await res.text();

        const logoutBtn = document.getElementById("logout-btn");

        if (logoutBtn) {
          logoutBtn.addEventListener("click", async (e) => {
            e.preventDefault();

            try {
              await logout();
            } catch (error) {
              console.error("Logout error:", error);

              // Ensure local session is cleared.
              clearSession();
            }
          });
        }

      } catch (error) {
        console.error("Navbar loading error:", error);
      }
    }

    // LOAD DASHBOARD

    async function loadDashboard() {
      try {
        const data = await getDashboard();

        const records = Array.isArray(data.records)
          ? data.records
          : [];

        if (records.length === 0) {
          historySection.innerHTML = "<p>No history yet.</p>";
          return;
        }

        const cards = records.map(rec => {

          const imageUrl = escapeHTML(
            rec.image_url || "placeholder.png"
          );

          const filename = escapeHTML(
            rec.filename || "Unknown file"
          );

          const prediction = escapeHTML(
            rec.prediction || "Unknown"
          );

          const probability = Number(rec.probability);

          const safeProbability = Number.isFinite(probability)
            ? Math.min(100, Math.max(0, probability))
            : 0;

          const predictionClass =
            String(rec.prediction || "").toLowerCase() === "positive"
              ? "positive"
              : "negative";

          return `
            <div class="card">

              <img
                src="${imageUrl}"
                alt="X-ray"
                onerror="this.src='placeholder.png'"
              >

              <p>${filename}</p>

              <p>${prediction}</p>

              <div class="probability-container">

                <div
                  class="probability-fill ${predictionClass}"
                  style="width:${safeProbability}%"
                >
                  ${safeProbability}%
                </div>

              </div>

            </div>
          `;
        });

        historySection.innerHTML = cards.join("");

      } catch (error) {
        console.error("Dashboard loading error:", error);

        historySection.innerHTML =
          "<p>Error loading dashboard. Please try again.</p>";
      }
    }

    // INITIALIZE

    async function initializeDashboard() {
      await loadNavbar();
      await loadDashboard();
    }

    initializeDashboard();

  </script>

</body>
</html>
