
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="css/login.css" />
  <script src="js/api.js" defer></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <h2>Create Account</h2>
      <p class="subtitle">Sign up to start using the app</p>

      <form id="register-form">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter a password"
          autocomplete="new-password"
          required
        />

        <button type="submit" id="register-btn">
          Register
        </button>

        <p
          id="register-message"
          class="login-message"
          role="status"
          aria-live="polite"
        ></p>
      </form>

      <div class="links">
        <span>•</span>
        <a href="login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("register-form");
    const messageEl = document.getElementById("register-message");
    const registerBtn = document.getElementById("register-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      messageEl.textContent = "";
      messageEl.style.color = "red";

      const email = form.email.value.trim().toLowerCase();
      const password = form.password.value;

      if (!email || !password) {
        messageEl.textContent = "Please enter your email and password.";
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = "Registering...";

      try {
        const res = await register(email, password);

        if (res.ok) {
          messageEl.style.color = "green";
          messageEl.textContent =
            res.msg || "Registered successfully. Check your email.";

          form.reset();

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);

          return;
        }

        messageEl.textContent = res.msg || "Registration failed.";
      } catch (error) {
        console.error("Registration error:", error);
        messageEl.textContent =
          error.message || "Unable to connect to the server. Please try again.";
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = "Register";
      }
    });
  </script>
</body>
</html>
