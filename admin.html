<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/admin.css" />
  <!-- Load api.js before this page's script. -->
  <script src="js/api.js"></script>
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <h1>Admin Dashboard</h1>
    <p class="subtitle">System control panel</p>
    <p id="admin-message" role="status" aria-live="polite"></p>

    <section class="card">
      <h2>Statistics</h2>
      <div id="stats">Loading...</div>
    </section>

    <section class="card">
      <h2>Users</h2>
      <label for="roleFilter"><b>Filter Users</b></label>
      <select id="roleFilter">
        <option value="all">Select Admins or Users</option>
        <option value="admin">Admins</option>
        <option value="user">Users</option>
      </select>
      <div id="users">Please select Admins or Users</div>
    </section>

    <section class="card">
      <h2>Records</h2>
      <label for="userFilter">Select User</label>
      <select id="userFilter">
        <option value="">-- Select a user --</option>
      </select>
      <div id="records" class="records-grid">
        <p>Select a user to view records</p>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    // AUTHENTICATION GUARD

    const role = localStorage.getItem("role");
    const adminMessage = document.getElementById("admin-message");
    const statsContainer = document.getElementById("stats");
    const usersContainer = document.getElementById("users");
    const recordsContainer = document.getElementById("records");
    const roleFilter = document.getElementById("roleFilter");
    const userFilter = document.getElementById("userFilter");

    let ALL_USERS = [];
    let ALL_RECORDS = [];
    let recordsRenderVersion = 0;

    const isAdmin = role === "admin" &&
      Boolean(localStorage.getItem("access_token"));

    if (!isAdmin) {
      window.location.replace("adminlogin.html");
    } else {
      initializeAdminDashboard();
    }

    // INITIALIZATION

    async function initializeAdminDashboard() {
      setupNavbar();
      setupEventListeners();
      await loadAdmin();
    }

    // COMMON UI HELPERS

    function showMessage(message, isError = false) {
      adminMessage.textContent = message;
      adminMessage.style.color = isError ? "#e53935" : "#2e7d32";
    }

    // Escape values before inserting API data into HTML.
    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function getUsersForSelectedRole() {
      const selectedRole = roleFilter.value;

      if (selectedRole !== "admin" && selectedRole !== "user") {
        return [];
      }

      return ALL_USERS.filter(user => user.role === selectedRole);
    }

    // NAVBAR / LOGOUT

    async function setupNavbar() {
      try {
        const response = await fetch("_navbar.html");

        if (!response.ok) {
          throw new Error("Unable to load navbar");
        }

        document.getElementById("navbar").innerHTML =
          await response.text();

        const logoutButton = document.getElementById("logout-btn");

        if (logoutButton) {
          logoutButton.addEventListener("click", async event => {
            event.preventDefault();

            try {
              // logout() in api.js calls clearSession().
              await logout();
            } catch (error) {
              console.error("Logout error:", error);
              // Ensure local credentials are cleared even if logout fails.
              if (typeof clearSession === "function") {
                clearSession();
              }
            }
          });
        }
      } catch (error) {
        console.error("Navbar loading failed:", error);
      }
    }

    // LOAD ADMIN DATA

    async function loadAdmin() {
      showMessage("");

      try {
        // These functions use apiRequest/authFetch from api.js.
        const [stats, users, records] = await Promise.all([
          getAdminStats(),
          getAllUsers(),
          getAllRecords()
        ]);

        ALL_USERS = Array.isArray(users) ? users : [];
        ALL_RECORDS = Array.isArray(records) ? records : [];

        renderStats(stats);

        renderUsers();

        // Preserve the selected user when data is reloaded,
        // unless that user is no longer in the filtered list.
        const previousUserId = userFilter.value;
        renderUserFilter(previousUserId);

        await renderRecords();
      } catch (error) {
        console.error("Admin loading error:", error);
        showMessage(error.message || "Failed to load admin panel", true);
      }
    }

    function renderStats(stats = {}) {
      statsContainer.innerHTML = `
        <div class="stats-grid">
          <div class="stat">
            ${escapeHTML(stats.total_users ?? 0)}
            <span>Total Users</span>
          </div>
          <div class="stat">
            ${escapeHTML(stats.verified_users ?? 0)}
            <span>Verified</span>
          </div>
          <div class="stat">
            ${escapeHTML(stats.total_records ?? 0)}
            <span>Total Records</span>
          </div>
        </div>
      `;
    }

    // RENDER USERS

    function renderUsers() {
      const selectedRole = roleFilter.value;

      if (selectedRole !== "admin" && selectedRole !== "user") {
        usersContainer.innerHTML = "<p>Please select Admins or Users.</p>";
        return;
      }

      const users = getUsersForSelectedRole();

      if (users.length === 0) {
        usersContainer.innerHTML = "<p>No users found for this role.</p>";
        return;
      }

      usersContainer.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Role</th>
              <th>Verified</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${users.map(user => {
              const id = escapeHTML(user._id);
              const email = escapeHTML(user.email);
              const userRole = escapeHTML(user.role);

              let actions = "";

              if (user.role === "admin") {
                actions = `
                  <button
                    type="button"
                    class="warning"
                    data-action="demote"
                    data-user-id="${id}"
                    data-email="${email}">
                    Demote
                  </button>
                `;
              } else {
                actions = user.verified
                  ? `
                    <button
                      type="button"
                      class="success"
                      data-action="promote"
                      data-user-id="${id}"
                      data-email="${email}">
                      Make Admin
                    </button>
                  `
                  : `
                    <button
                      type="button"
                      class="success"
                      data-action="verify"
                      data-user-id="${id}"
                      data-email="${email}">
                      Verify
                    </button>
                  `;

                actions += `
                  <button
                    type="button"
                    class="danger"
                    data-action="delete-user"
                    data-user-id="${id}"
                    data-email="${email}">
                    Delete
                  </button>
                `;
              }

              return `
                <tr>
                  <td>${email}</td>
                  <td>${userRole}</td>
                  <td>${user.verified ? "Yes" : "No"}</td>
                  <td>${actions}</td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      `;
    }

    // RENDER USER FILTER

    function renderUserFilter(preferredUserId = "") {
      const users = getUsersForSelectedRole();

      userFilter.innerHTML = `
        <option value="">-- Select a user --</option>
        ${users.map(user => `
          <option value="${escapeHTML(user._id)}">
            ${escapeHTML(user.email)}
          </option>
        `).join("")}
      `;

      const userStillExists = users.some(
        user => String(user._id) === String(preferredUserId)
      );

      userFilter.value = userStillExists ? String(preferredUserId) : "";
    }

    // USER ACTIONS

    async function handleUserAction(action, userId, email) {
      const actionDetails = {
        verify: {
          url: `/admin/users/${encodeURIComponent(userId)}/verify`,
          message: `${email} verified successfully`,
          confirm: `Verify ${email}?`
        },
        promote: {
          url: `/admin/users/${encodeURIComponent(userId)}/promote`,
          message: `${email} is now an admin`,
          confirm: `Make ${email} admin?`
        },
        demote: {
          url: `/admin/users/${encodeURIComponent(userId)}/demote`,
          message: `${email} is now a normal user`,
          confirm: `Remove admin role from ${email}?`
        }
      };

      const details = actionDetails[action];
      if (!details) return;

      if (!confirm(details.confirm)) return;

      try {
        await apiRequest(`${API_BASE}${details.url}`, {
          method: "POST"
        });

        showMessage(details.message);
        await loadAdmin();
      } catch (error) {
        console.error(`${action} user failed:`, error);
        showMessage(error.message || `Failed to ${action} user`, true);
      }
    }

    async function uiDeleteUser(userId, email) {
      if (!confirm(`Delete user ${email} and ALL records?`)) return;

      try {
        await apiDeleteUser(userId);

        userFilter.value = "";
        recordsContainer.innerHTML = "<p>Select a user to view records</p>";

        showMessage(`User ${email} deleted successfully`);
        await loadAdmin();
      } catch (error) {
        console.error("User deletion failed:", error);
        showMessage(error.message || "Failed to delete user", true);
      }
    }

    // RECORD IMAGE URL

    async function getRecordImageUrl(record) {
      // Prefer a presigned URL returned by the backend.
      if (record.image_url) {
        return record.image_url;
      }

      // Support current S3 image_key records and older file_id records.
      const imageIdentifier = record.image_key || record.file_id;

      if (!imageIdentifier) {
        return null;
      }

      try {
        return await fetchAdminImage(imageIdentifier);
      } catch (error) {
        console.error("Failed to load record image:", error);
        return null;
      }
    }

    // DELETE RECORD

    async function uiDeleteRecord(recordId) {
      if (!confirm("Delete this record and its image?")) return;

      try {
        await apiDeleteRecord(recordId);
        showMessage("Record deleted successfully");
        await loadAdmin();
      } catch (error) {
        console.error("Record deletion failed:", error);
        showMessage(error.message || "Failed to delete record", true);
      }
    }

    // RENDER RECORDS

    async function renderRecords() {
      const currentRenderVersion = ++recordsRenderVersion;
      const selectedRole = roleFilter.value;
      const selectedUserId = userFilter.value;

      if (selectedRole !== "admin" && selectedRole !== "user") {
        recordsContainer.innerHTML = "<p>Select Admins or Users first.</p>";
        return;
      }

      if (!selectedUserId) {
        recordsContainer.innerHTML = "<p>Select a user to view records.</p>";
        return;
      }

      const userRecords = ALL_RECORDS.filter(
        record => String(record.user_id) === String(selectedUserId)
      );

      if (userRecords.length === 0) {
        recordsContainer.innerHTML = "<p>No records found for this user.</p>";
        return;
      }

      recordsContainer.innerHTML = "<p>Loading records...</p>";

      try {
        const cards = await Promise.all(
          userRecords.map(async record => {
            const imageUrl = await getRecordImageUrl(record);

            const filename = escapeHTML(record.filename || "Unknown file");
            const prediction = escapeHTML(record.prediction || "Unknown");
            const probability = escapeHTML(record.probability ?? 0);
            const jobId = escapeHTML(record.job_id || "N/A");
            const recordId = escapeHTML(record._id);

            const imageMarkup = imageUrl
              ? `
                <img
                  src="${escapeHTML(imageUrl)}"
                  alt="${filename || "X-ray image"}"
                  onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                />
                <div class="image-error" style="display:none">
                  Image unavailable
                </div>
              `
              : `
                <div class="image-error">Image unavailable</div>
              `;

            return `
              <div class="record-card">
                ${imageMarkup}
                <div class="info">
                  <b>${filename}</b>
                  <p>${prediction} (${probability}%)</p>
                  <p>Job ID: ${jobId}</p>
                  <button
                    type="button"
                    class="danger"
                    data-action="delete-record"
                    data-record-id="${recordId}">
                    Delete
                  </button>
                </div>
              </div>
            `;
          })
        );

        // Do not let an older image request overwrite a newer selection.
        if (currentRenderVersion !== recordsRenderVersion) return;

        recordsContainer.innerHTML = cards.join("");
      } catch (error) {
        if (currentRenderVersion !== recordsRenderVersion) return;

        console.error("Record rendering error:", error);
        recordsContainer.innerHTML = "<p>Error loading records.</p>";
      }
    }

    // EVENT LISTENERS

    function setupEventListeners() {
      roleFilter.addEventListener("change", async () => {
        userFilter.value = "";
        renderUsers();
        renderUserFilter();
        await renderRecords();
      });

      userFilter.addEventListener("change", renderRecords);

      // Event delegation: one listener handles all user action buttons.
      usersContainer.addEventListener("click", async event => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;

        const { action, userId, email } = button.dataset;

        if (action === "delete-user") {
          await uiDeleteUser(userId, email);
        } else {
          await handleUserAction(action, userId, email);
        }
      });

      // Event delegation for record delete buttons.
      recordsContainer.addEventListener("click", async event => {
        const button = event.target.closest(
          'button[data-action="delete-record"]'
        );

        if (!button) return;

        await uiDeleteRecord(button.dataset.recordId);
      });
    }
  </script>
</body>
</html>
